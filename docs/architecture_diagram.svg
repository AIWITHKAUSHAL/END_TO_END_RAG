<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="End-to-end RAG architecture diagram">
  <rect width="1280" height="720" fill="#f7f9fb"/>
  <text x="640" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18202a">End-to-End RAG Architecture</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#425466"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #425466; stroke-width: 2; rx: 8; }
      .store { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .query { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 8; }
      .answer { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 8; }
      .label { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #18202a; }
      .small { font-family: Arial, sans-serif; font-size: 14px; fill: #425466; }
      .line { stroke: #425466; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="55" y="132" width="145" height="78"/>
  <text class="label" x="127" y="165" text-anchor="middle">Documents</text>
  <text class="small" x="127" y="190" text-anchor="middle">PDF, TXT, MD</text>

  <rect class="box" x="240" y="132" width="145" height="78"/>
  <text class="label" x="312" y="165" text-anchor="middle">Parsing</text>
  <text class="small" x="312" y="190" text-anchor="middle">Extract text</text>

  <rect class="box" x="425" y="132" width="145" height="78"/>
  <text class="label" x="497" y="165" text-anchor="middle">Cleaning</text>
  <text class="small" x="497" y="190" text-anchor="middle">Remove noise</text>

  <rect class="box" x="610" y="132" width="145" height="78"/>
  <text class="label" x="682" y="165" text-anchor="middle">Chunking</text>
  <text class="small" x="682" y="190" text-anchor="middle">250, 500, 900</text>

  <rect class="box" x="795" y="132" width="155" height="78"/>
  <text class="label" x="872" y="165" text-anchor="middle">Embeddings</text>
  <text class="small" x="872" y="190" text-anchor="middle">Gemini vectors</text>

  <rect class="store" x="1000" y="124" width="190" height="94"/>
  <text class="label" x="1095" y="160" text-anchor="middle">FAISS Index</text>
  <text class="small" x="1095" y="186" text-anchor="middle">Vectors + metadata</text>

  <path class="line" d="M200 171 H240"/>
  <path class="line" d="M385 171 H425"/>
  <path class="line" d="M570 171 H610"/>
  <path class="line" d="M755 171 H795"/>
  <path class="line" d="M950 171 H1000"/>

  <rect class="query" x="105" y="430" width="155" height="78"/>
  <text class="label" x="182" y="463" text-anchor="middle">User Query</text>
  <text class="small" x="182" y="488" text-anchor="middle">Question</text>

  <rect class="query" x="310" y="430" width="165" height="78"/>
  <text class="label" x="392" y="463" text-anchor="middle">Query Vector</text>
  <text class="small" x="392" y="488" text-anchor="middle">Same embedder</text>

  <rect class="box" x="525" y="430" width="175" height="78"/>
  <text class="label" x="612" y="463" text-anchor="middle">Similarity</text>
  <text class="small" x="612" y="488" text-anchor="middle">Top-K search</text>

  <rect class="box" x="750" y="430" width="155" height="78"/>
  <text class="label" x="827" y="463" text-anchor="middle">Prompt</text>
  <text class="small" x="827" y="488" text-anchor="middle">Context + question</text>

  <rect class="box" x="955" y="430" width="140" height="78"/>
  <text class="label" x="1025" y="463" text-anchor="middle">Gemini LLM</text>
  <text class="small" x="1025" y="488" text-anchor="middle">Generate</text>

  <rect class="answer" x="1125" y="422" width="120" height="94"/>
  <text class="label" x="1185" y="458" text-anchor="middle">Answer</text>
  <text class="small" x="1185" y="484" text-anchor="middle">+ Sources</text>

  <path class="line" d="M260 469 H310"/>
  <path class="line" d="M475 469 H525"/>
  <path class="line" d="M700 469 H750"/>
  <path class="line" d="M905 469 H955"/>
  <path class="line" d="M1095 469 H1125"/>
  <path class="line" d="M1095 218 V330 H612 V430"/>

  <text class="small" x="640" y="650" text-anchor="middle">Every answer returns the exact source file, chunk number, similarity score, and retrieved text used for generation.</text>
</svg>
